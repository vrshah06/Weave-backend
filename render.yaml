services:
  - type: web
    name: weave-backend
    env: python
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium
    startCommand: uvicorn app:sio_app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    envVars:
      - key: NODE_ENV
        value: production
      - key: HEADLESS
        value: "true"
      - key: DEFAULT_TIMEOUT
        value: "30000"
      - key: SEARCH_TIMEOUT
        value: "30000"
      - key: MESSAGE_LOAD_TIMEOUT
        value: "30000"
      - key: MONGODB_URI
        sync: false
      - key: WEAVE_EMAIL
        sync: false
      - key: WEAVE_PASSWORD
        sync: false
